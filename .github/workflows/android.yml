name: Build MANSY A STRIKE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - رئيسي

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Extract game project
        shell: bash
        run: |
          unzip -o MANSY_A_STRIKE_FINAL_ALPHA_1.0.0.zip -d extracted

          PROJECT_DIR=$(find extracted -name project.godot -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT_DIR"

      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.3
          use-dotnet: false
          include-templates: true

      - name: Create Android export preset
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MANSY_A_STRIKE.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="com.modyk.mansyastrike"
          package/name="MANSY A STRIKE"

          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true

          user_data_backup/allow=false
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          godot --headless --editor --import --quit

      - name: Build Android APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/MANSY_A_STRIKE.apk

      - name: Check APK
        shell: bash
        run: |
          ls -lh "$PROJECT_DIR/build/"
          test -f "$PROJECT_DIR/build/MANSY_A_STRIKE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANSY-A-STRIKE-APK
          path: ${{ env.PROJECT_DIR }}/build/MANSY_A_STRIKE.apk
          if-no-files-found: error
